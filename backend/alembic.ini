# Configuração do Alembic (F0.3).
#
# A URL do banco NÃO fica aqui: o env.py lê `database_url` de app.core.config
# (que vem do ambiente / .env). Assim o mesmo arquivo serve ao serviço `migrate`
# (host `db`) e à execução no host (host `127.0.0.1:5442`), só trocando a env.

[alembic]
script_location = app/migrations
prepend_sys_path = .
path_separator = os
# Nome dos arquivos de versão: 0001_descricao, 0002_descricao, ...
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
