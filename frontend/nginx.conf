# Nginx do container web (seção 10.4): serve a SPA e faz proxy de /api para a API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Segurança básica (sem CSP agressiva aqui; produção/Traefik refina na F7).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Assets com hash no nome: cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: encaminha para o serviço "api" na rede interna do Compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA: qualquer outra rota cai no index.html (React Router cuida do roteamento).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
